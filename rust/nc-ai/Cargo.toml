[package]
name = "nc-ai"
version = "1.0.0-beta.3"
edition = "2024"
license-file = "../../LICENSE"

[lib]
path = "src/lib.rs"

[dependencies]
nc-data = { path = "../nc-data" }
nc-engine = { path = "../nc-engine" }
nc-harness = { path = "../nc-harness" }
# The aggressor policy is the executor's sparring partner.
nc-fuzz = { path = "../nc-fuzz" }
# A seat's memory persists between maintenance runs in real games (t165).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
