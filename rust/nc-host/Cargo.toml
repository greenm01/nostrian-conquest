[package]
name = "nc-host"
version = "1.0.0-beta.4"
edition = "2024"
license-file = "../../LICENSE"

[[bin]]
name = "nc-host"
path = "src/main.rs"

[dependencies]
nc-ai-onnx = { path = "../nc-ai-onnx" }
nc-data = { path = "../nc-data" }
nc-engine = { path = "../nc-engine" }
nc-log = { path = "../nc-log" }
nc-nostr = { path = "../nc-nostr" }
tracing = "0.1"

nostr-sdk = { version = "0.44", features = ["nip44", "nip59"] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kdl = "4"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
blake3 = "1"
rand = "0.8"
hex = "0.4"
url = "2"
base64 = "0.22"
csv = "1"
rust_xlsxwriter = "0.80"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
blake3 = "1"
tempfile = "3"

[build-dependencies]
winresource = "0.1"
