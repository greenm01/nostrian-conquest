[package]
name = "nc-herald"
version = "1.0.0-beta.3"
edition = "2024"
license-file = "../../LICENSE"

[[bin]]
name = "nc-herald"
path = "src/main.rs"

[dependencies]
nc-dropfile = { path = "../nc-dropfile" }
nc-log = { path = "../nc-log" }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
