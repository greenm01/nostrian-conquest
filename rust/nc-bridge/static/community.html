<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nostrian Conquest — Games</title>
<link rel="stylesheet" href="/terminal/community.css">
</head>
<body>
<header>
<h1><a class="brand-link" href="/">Nostrian Conquest</a></h1>
<p class="intro">Find a game. Build an empire. Play the long game.</p>
<nav aria-label="Main navigation">
<a href="https://nostrian-conquest.com/" target="_blank" rel="noopener noreferrer">Home</a>
<a href="/" aria-current="page">Games</a>
<a href="https://discord.gg/eZMRpdQTu" target="_blank" rel="noopener noreferrer">Community Discord</a>
<a href="/howto">How to play</a>
<a href="/contact">Contact sysop</a>
</nav>
</header>
<section aria-label="Your account" class="account">
<form id="nostr-login" hidden>
<div class="login-actions"><a class="login-link" href="/auth/login">Sign in with Discord</a><button type="submit">Sign in with Nostr</button></div>
<p><label>Nostr player name (optional) <input id="nostr-name" maxlength="25" autocomplete="nickname"></label></p>
</form>
<p id="identity" aria-live="polite">Checking sign-in…</p>
<button id="logout" type="button" hidden>Sign out</button>
<p id="notice" role="status"></p>
</section>
<main id="games" aria-label="Available games"></main>
<script src="/terminal/community.js"></script>
</body>
</html>
