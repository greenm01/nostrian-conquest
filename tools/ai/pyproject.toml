[project]
name = "nc-ai-tools"
version = "0.1.0"
description = "Self-play experience and learners for Nostrian Conquest AI seats"
requires-python = ">=3.11"
dependencies = [
    "nc-ai-env",
    "numpy>=2",
    "openskill>=6.2.0",
    "pyarrow>=18",
    "torch>=2.8",
]

[tool.uv]
package = false

[tool.uv.sources]
nc-ai-env = { path = "../../rust/nc-ai-py" }

[dependency-groups]
dev = [
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "onnxscript>=0.7.2",
]
